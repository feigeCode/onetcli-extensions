[package]
name = "navop-rdp-helper"
version = "0.3.6"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
ironrdp = { git = "https://github.com/feigeCode/IronRDP", rev = "4b7522e596ac3428d164e17a8d455a0a5cad7bde", features = [
    "connector",
    "cliprdr",
    "graphics",
    "input",
    "pdu",
] }
ironrdp-client = { git = "https://github.com/feigeCode/IronRDP", rev = "4b7522e596ac3428d164e17a8d455a0a5cad7bde", default-features = false, features = [
    "clipboard",
    "native-tls",
    "sound",
] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whoami = "1"
