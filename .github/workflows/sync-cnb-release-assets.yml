name: Sync CNB Release Assets

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to sync, for example dm-v0.1.5"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync, for example dm-v0.1.5"
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CNB_REPOSITORY: "navop-dev/navop-extensions"

concurrency:
  group: extension-cnb-release
  cancel-in-progress: false

jobs:
  sync-release-to-cnb:
    name: Sync release to CNB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Sync release assets to CNB
        env:
          TAG_NAME: ${{ inputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_USERNAME: cnb
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          # Trim any accidental line breaks from the secret so tools that read
          # CNB_TOKEN directly receive a clean value.
          CNB_TOKEN="$(printf '%s' "$CNB_TOKEN" | tr -d '\r\n')"
          if [[ ! "$TAG_NAME" =~ ^[a-z0-9][a-z0-9._-]*-v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid extension release tag: ${TAG_NAME}"
            exit 1
          fi
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::CNB_TOKEN secret is empty or not set"
            exit 1
          fi
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null

          git remote remove cnb 2>/dev/null || true
          git remote add cnb "https://cnb.cool/${CNB_REPOSITORY}.git"

          # Authenticate with HTTP Basic auth shipped as an Authorization
          # header, the same mechanism actions/checkout uses for GitHub. This
          # works with any token characters, unlike ~/.git-credentials whose
          # URL format is corrupted by tokens containing @, /, ? or #.
          export GIT_TERMINAL_PROMPT=0
          CNB_AUTH="$(printf 'cnb:%s' "$CNB_TOKEN" | base64 -w0)"
          git config --global "http.https://cnb.cool/.extraheader" "Authorization: Basic ${CNB_AUTH}"

          # Verify the repository is reachable before doing any work, so
          # connectivity problems fail with a clear message instead of a
          # cryptic git error further down.
          if ! git ls-remote --tags cnb >/dev/null 2>&1; then
            echo "::error::git authentication against cnb.cool failed. Verify the CNB_TOKEN secret and that ${CNB_REPOSITORY} exists on CNB."
            exit 1
          fi

          # CNB release synchronization requires the Git tag to exist first.
          # Because --tags pushes the complete tag set, replace every CNB tag
          # whose tag object was moved or recreated before pushing all tags.
          declare -A remote_tag_oids=()
          while read -r remote_oid remote_ref; do
            remote_tag_oids["${remote_ref#refs/tags/}"]="$remote_oid"
          done < <(git ls-remote --tags cnb | awk '$2 !~ /\^\{\}$/')

          while read -r local_ref; do
            tag_name="${local_ref#refs/tags/}"
            local_oid="$(git rev-parse "$local_ref")"
            remote_oid="${remote_tag_oids[$tag_name]-}"
            if [ -n "$remote_oid" ] && [ "$remote_oid" != "$local_oid" ]; then
              echo "CNB tag ${tag_name} points to ${remote_oid}; replacing it with ${local_oid}"
              git push cnb ":refs/tags/${tag_name}"
            fi
          done < <(git for-each-ref --format='%(refname)' refs/tags)

          git push cnb --tags

          wget -q https://cnb.cool/znb/mpgrm/-/releases/download/v0.1.0/mpgrm_linux_amd64.tar.gz
          tar -xf mpgrm_linux_amd64.tar.gz
          chmod +x mpgrm

          ./mpgrm releases sync \
            --repo "https://github.com/${GITHUB_REPOSITORY}.git" \
            --target-repo "https://cnb.cool/${CNB_REPOSITORY}.git" \
            --tags "${TAG_NAME}"
