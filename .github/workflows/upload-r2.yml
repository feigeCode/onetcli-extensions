name: Upload R2

on:
  workflow_call:
    inputs:
      tag:
        description: Extension release tag, for example duckdb-v1.0.0
        required: true
        type: string
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Extension release tag, for example duckdb-v1.0.0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: extension-marketplace-publish
  cancel-in-progress: false

jobs:
  upload:
    name: Upload extension assets to R2
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.tag || '' }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            release_tag="$INPUT_TAG"
            extension_id="${release_tag%%-v*}"
            extension_version="${release_tag#${extension_id}-v}"
          else
            mkdir -p run-metadata
            gh run download "$WORKFLOW_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name release-metadata \
              --dir run-metadata
            release_tag="$(node -e 'const fs = require("fs"); const d = JSON.parse(fs.readFileSync("run-metadata/release-metadata.json", "utf8")); process.stdout.write(d.release_tag);')"
            extension_id="$(node -e 'const fs = require("fs"); const d = JSON.parse(fs.readFileSync("run-metadata/release-metadata.json", "utf8")); process.stdout.write(d.extension_id);')"
            extension_version="$(node -e 'const fs = require("fs"); const d = JSON.parse(fs.readFileSync("run-metadata/release-metadata.json", "utf8")); process.stdout.write(d.extension_version);')"
          fi
          if [[ ! "$extension_id" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid extension id resolved from release tag: $extension_id"
            exit 1
          fi
          if [[ ! "$extension_version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Invalid extension version resolved from release tag: $extension_version"
            exit 1
          fi
          if [ "$release_tag" != "${extension_id}-v${extension_version}" ]; then
            echo "::error::Release tag must match <extension-id>-v<version>: $release_tag"
            exit 1
          fi
          gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "extension_id=$extension_id" >> "$GITHUB_OUTPUT"
          echo "version=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Resolve extension metadata
        id: extension
        env:
          EXTENSION_ID: ${{ steps.release.outputs.extension_id }}
        run: |
          set -euo pipefail
          metadata="$(node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const id = process.env.EXTENSION_ID;
          const roots = ["extensions/ipc", "extensions/remote-desktop", "extensions/mcp-helper", "extensions/acp-agent", "extensions/wasm", "extensions/language", "extensions/language-bundle"];
          let data = null;
          for (const root of roots) {
            const file = path.join(root, id, "extension.build.json");
            if (fs.existsSync(file)) {
              data = JSON.parse(fs.readFileSync(file, "utf8"));
              break;
            }
          }
          if (!data) throw new Error(`unknown extension id: ${id}`);
          process.stdout.write(JSON.stringify({
            kind: data.kind,
            targets: data.targets,
            r2Prefix: data.r2Prefix,
          }));
          NODE
          )"
          echo "kind=$(node -e 'const data = JSON.parse(process.argv[1]); process.stdout.write(data.kind);' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "targets=$(node -e 'const data = JSON.parse(process.argv[1]); process.stdout.write(JSON.stringify(data.targets));' "$metadata")" >> "$GITHUB_OUTPUT"
          echo "r2_prefix=$(node -e 'const data = JSON.parse(process.argv[1]); process.stdout.write(data.r2Prefix);' "$metadata")" >> "$GITHUB_OUTPUT"

      - name: Verify R2 secrets are set
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_R2_ACCESS_KEY_ID CLOUDFLARE_R2_SECRET_ACCESS_KEY CLOUDFLARE_R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} secret is empty or not set"
              exit 1
            fi
          done

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p artifacts
          package_pattern="${{ steps.release.outputs.extension_id }}-driver-*.tar.gz"
          if [ "${{ steps.extension.outputs.kind }}" = "remote_desktop_provider" ]; then
            package_pattern="${{ steps.release.outputs.extension_id }}-remote-desktop-provider-*.tar.gz"
          elif [ "${{ steps.extension.outputs.kind }}" = "mcp_helper" ]; then
            package_pattern="${{ steps.release.outputs.extension_id }}-mcp-helper-*.tar.gz"
          elif [ "${{ steps.extension.outputs.kind }}" = "acp_agent" ]; then
            package_pattern="${{ steps.release.outputs.extension_id }}-acp-agent-*.tar.gz"
          elif [ "${{ steps.extension.outputs.kind }}" = "composite" ]; then
            package_pattern="${{ steps.release.outputs.extension_id }}-composite-*.tar.gz"
          elif [ "${{ steps.extension.outputs.kind }}" = "language" ]; then
            package_pattern="${{ steps.release.outputs.extension_id }}-language-*.tar.gz"
          elif [ "${{ steps.extension.outputs.kind }}" = "language_bundle" ]; then
            package_pattern="${{ steps.release.outputs.extension_id }}-language-bundle-*.tar.gz"
          fi
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$package_pattern" \
            --pattern "sha256sums.txt" \
            --pattern "extension-manifest.json" \
            --dir artifacts
          ls -la artifacts

      - name: Verify downloaded assets
        env:
          EXTENSION_ID: ${{ steps.release.outputs.extension_id }}
          EXTENSION_KIND: ${{ steps.extension.outputs.kind }}
          EXTENSION_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGETS_JSON: ${{ steps.extension.outputs.targets }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const targets = JSON.parse(process.env.TARGETS_JSON);
          const fileNameForTarget = (target) => {
            switch (process.env.EXTENSION_KIND) {
              case "database_driver":
                return `${process.env.EXTENSION_ID}-driver-${target}.tar.gz`;
              case "remote_desktop_provider":
                return `${process.env.EXTENSION_ID}-remote-desktop-provider-${target}.tar.gz`;
              case "mcp_helper":
                return `${process.env.EXTENSION_ID}-mcp-helper-${target}.tar.gz`;
              case "acp_agent":
                return `${process.env.EXTENSION_ID}-acp-agent-${target}.tar.gz`;
              case "composite":
                return `${process.env.EXTENSION_ID}-composite-${target}.tar.gz`;
              case "language":
                return `${process.env.EXTENSION_ID}-language-${target}.tar.gz`;
              case "language_bundle":
                return `${process.env.EXTENSION_ID}-language-bundle-${target}.tar.gz`;
              default:
                throw new Error(`unsupported extension kind: ${process.env.EXTENSION_KIND}`);
            }
          };
          const checksumLines = fs.readFileSync("artifacts/sha256sums.txt", "utf8")
            .split(/\r?\n/)
            .filter(Boolean);
          const checksums = new Map();
          for (const line of checksumLines) {
            const match = line.match(/^([0-9a-f]{64})\s+(.+)$/);
            if (!match) throw new Error(`invalid checksum line: ${line}`);
            if (checksums.has(match[2])) throw new Error(`duplicate checksum entry: ${match[2]}`);
            checksums.set(match[2], match[1]);
          }
          const manifest = JSON.parse(fs.readFileSync("artifacts/extension-manifest.json", "utf8"));
          if (manifest.release_version !== process.env.RELEASE_TAG) {
            throw new Error("extension manifest release tag mismatch");
          }
          if (!Array.isArray(manifest.extensions) || manifest.extensions.length !== 1) {
            throw new Error("extension manifest must contain exactly one extension");
          }
          const extension = manifest.extensions[0];
          if (
            extension.id !== process.env.EXTENSION_ID
            || extension.kind !== process.env.EXTENSION_KIND
            || extension.version !== process.env.EXTENSION_VERSION
            || extension.release_tag !== process.env.RELEASE_TAG
          ) {
            throw new Error("extension manifest metadata mismatch");
          }
          const expectedFiles = new Set();
          for (const target of targets) {
            const file = fileNameForTarget(target);
            expectedFiles.add(file);
            const filePath = path.join("artifacts", file);
            const stat = fs.statSync(filePath, { throwIfNoEntry: false });
            if (!stat?.isFile() || stat.size === 0) throw new Error(`missing or empty asset: ${file}`);
            const actualSha256 = createHash("sha256").update(fs.readFileSync(filePath)).digest("hex");
            if (checksums.get(file) !== actualSha256) {
              throw new Error(`checksum file mismatch for ${file}`);
            }
            const artifact = extension.artifacts?.[target];
            if (artifact?.file !== file || artifact.sha256 !== actualSha256) {
              throw new Error(`extension manifest artifact mismatch for ${target}`);
            }
          }
          if (
            checksums.size !== expectedFiles.size
            || [...checksums.keys()].some((file) => !expectedFiles.has(file))
          ) {
            throw new Error("checksum file contains unexpected assets");
          }
          if (
            !extension.artifacts
            || Object.keys(extension.artifacts).length !== targets.length
            || Object.keys(extension.artifacts).some((target) => !targets.includes(target))
          ) {
            throw new Error("extension manifest contains unexpected targets");
          }
          NODE

      - name: Upload extension assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          EXTENSION_ID: ${{ steps.release.outputs.extension_id }}
          EXTENSION_KIND: ${{ steps.extension.outputs.kind }}
          EXTENSION_VERSION: ${{ steps.release.outputs.version }}
          R2_PREFIX: ${{ steps.extension.outputs.r2_prefix }}
          TARGETS_JSON: ${{ steps.extension.outputs.targets }}
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload_object() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local cache_control="$4"
            aws s3 cp "$source" "s3://${CLOUDFLARE_R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "$cache_control"
          }
          node <<'NODE' > upload-assets.txt
          const targets = JSON.parse(process.env.TARGETS_JSON);
          for (const target of targets) {
            switch (process.env.EXTENSION_KIND) {
              case "database_driver":
                console.log(`${process.env.EXTENSION_ID}-driver-${target}.tar.gz`);
                break;
              case "remote_desktop_provider":
                console.log(`${process.env.EXTENSION_ID}-remote-desktop-provider-${target}.tar.gz`);
                break;
              case "mcp_helper":
                console.log(`${process.env.EXTENSION_ID}-mcp-helper-${target}.tar.gz`);
                break;
              case "acp_agent":
                console.log(`${process.env.EXTENSION_ID}-acp-agent-${target}.tar.gz`);
                break;
              case "composite":
                console.log(`${process.env.EXTENSION_ID}-composite-${target}.tar.gz`);
                break;
              case "language":
                console.log(`${process.env.EXTENSION_ID}-language-${target}.tar.gz`);
                break;
              case "language_bundle":
                console.log(`${process.env.EXTENSION_ID}-language-bundle-${target}.tar.gz`);
                break;
              default:
                throw new Error(`unsupported extension kind: ${process.env.EXTENSION_KIND}`);
            }
          }
          NODE
          while read -r file; do
            upload_object "artifacts/${file}" "${R2_PREFIX}/${EXTENSION_VERSION}/${file}" "application/gzip" "public, max-age=31536000, immutable"
          done < upload-assets.txt

      - name: Publish marketplace manifests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          R2_PREFIX: ${{ steps.extension.outputs.r2_prefix }}
        run: |
          set -euo pipefail
          endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          upload_object() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local cache_control="$4"
            aws s3 cp "$source" "s3://${CLOUDFLARE_R2_BUCKET}/${key}" \
              --endpoint-url "$endpoint" \
              --content-type "$content_type" \
              --cache-control "$cache_control"
          }
          current_manifest="artifacts/current-extension-manifest.json"
          cp artifacts/extension-manifest.json "$current_manifest"
          upload_object "$current_manifest" "${R2_PREFIX}/manifest.json" "application/json; charset=utf-8" "no-cache"
          upload_object "manifest.json" "extensions/manifest.json" "application/json; charset=utf-8" "no-cache"
