name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test repository scripts
        run: node --test tests/scripts.test.mjs
      - name: Validate workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/ci.yml"); YAML.load_file(".github/workflows/release.yml"); YAML.load_file(".github/workflows/upload-r2.yml"); YAML.load_file(".github/workflows/backfill-windows-x86.yml"); YAML.load_file(".github/workflows/sync-cnb-release-assets.yml"); YAML.load_file(".github/workflows/sync-cnb-latest.yml"); puts "workflow yaml ok"'

  detect:
    name: Detect changed extensions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          node scripts/changed-extensions.mjs "$BASE_SHA" "$HEAD_SHA" > matrix.json
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has_changes=$(node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("matrix.json", "utf8")); process.stdout.write(m.include.length > 0 ? "true" : "false");')" >> "$GITHUB_OUTPUT"

  test:
    name: Test changed extensions
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: ${{ matrix.language == 'rust' || matrix.language == 'rust-wasm' }}
      - uses: actions/setup-go@v5
        if: ${{ matrix.language == 'go' }}
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        if: ${{ matrix.language == 'java' }}
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Linux remote desktop audio dependencies
        if: ${{ matrix.language == 'rust' && matrix.kind == 'remote_desktop_provider' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev
      - name: Test Rust manifest package
        if: ${{ matrix.language == 'rust' && matrix.manifest_path != '' }}
        shell: bash
        run: |
          if [ "${{ matrix.kind }}" = "remote_desktop_provider" ]; then
            export CARGO_TARGET_DIR="${RUNNER_TEMP}/cargo-target"
          fi
          cargo test --manifest-path "${{ matrix.manifest_path }}" -- --nocapture
      - name: Test Rust workspace package
        if: ${{ (matrix.language == 'rust' || matrix.language == 'rust-wasm') && matrix.manifest_path == '' && matrix.package != '' }}
        shell: bash
        run: |
          if [ "${{ matrix.kind }}" = "remote_desktop_provider" ]; then
            export CARGO_TARGET_DIR="${RUNNER_TEMP}/cargo-target"
          fi
          cargo test -p "${{ matrix.package }}" -- --nocapture
      - name: Test Go drivers
        if: ${{ matrix.language == 'go' }}
        run: go test ./...
      - name: Test Java driver
        if: ${{ matrix.language == 'java' }}
        run: mvn -f "${{ matrix.package }}/pom.xml" test

  windows-x86-build:
    name: Build Windows x86 (${{ matrix.extension }})
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        if: ${{ matrix.windows_x86 == true }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        if: ${{ matrix.windows_x86 == true && matrix.language == 'rust' }}
        with:
          target: i686-pc-windows-msvc
      - uses: actions/setup-go@v5
        if: ${{ matrix.windows_x86 == true && matrix.language == 'go' }}
        with:
          go-version-file: go.mod
      - name: Install Windows Rust CMake dependencies
        if: ${{ matrix.windows_x86 == true && matrix.language == 'rust' && matrix.kind == 'remote_desktop_provider' }}
        shell: pwsh
        run: choco install ninja -y --no-progress
      - name: Build Rust extension
        if: ${{ matrix.windows_x86 == true && matrix.language == 'rust' && matrix.package != '' }}
        shell: bash
        run: |
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target"
          if [ "${{ matrix.kind }}" = "remote_desktop_provider" ]; then
            export CMAKE_GENERATOR=Ninja
          fi
          if [ -n "${{ matrix.manifest_path }}" ]; then
            cargo build --release --manifest-path "${{ matrix.manifest_path }}" --target i686-pc-windows-msvc
          else
            cargo build --release -p "${{ matrix.package }}" --target i686-pc-windows-msvc
          fi
      - name: Build Go extension
        if: ${{ matrix.windows_x86 == true && matrix.language == 'go' }}
        shell: bash
        run: bash scripts/build-go-driver.sh "${{ matrix.extension }}" i686-pc-windows-msvc
      - name: Package and verify Windows x86 extension
        if: ${{ matrix.windows_x86 == true }}
        shell: bash
        run: |
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target"
          mkdir -p artifacts
          if [ "${{ matrix.kind }}" = "database_driver" ]; then
            bash scripts/package-driver.sh "${{ matrix.extension }}" i686-pc-windows-msvc artifacts 0.0.0-ci
            bash scripts/verify-package.sh "artifacts/${{ matrix.extension }}-driver-i686-pc-windows-msvc.tar.gz"
          elif [ "${{ matrix.kind }}" = "remote_desktop_provider" ]; then
            bash scripts/package-remote-desktop-provider.sh "${{ matrix.extension }}" i686-pc-windows-msvc artifacts 0.0.0-ci
            bash scripts/verify-remote-desktop-provider-package.sh "artifacts/${{ matrix.extension }}-remote-desktop-provider-i686-pc-windows-msvc.tar.gz"
          elif [ "${{ matrix.kind }}" = "acp_agent" ]; then
            bash scripts/package-acp-agent.sh "${{ matrix.extension }}" i686-pc-windows-msvc artifacts 0.0.0-ci
            bash scripts/verify-acp-agent-package.sh "artifacts/${{ matrix.extension }}-acp-agent-i686-pc-windows-msvc.tar.gz"
          elif [ "${{ matrix.kind }}" = "composite" ]; then
            bash scripts/package-composite-extension.sh "${{ matrix.extension }}" i686-pc-windows-msvc artifacts 0.0.0-ci
            bash scripts/verify-composite-package.sh "artifacts/${{ matrix.extension }}-composite-i686-pc-windows-msvc.tar.gz"
          else
            echo "::error::Unsupported Windows x86 extension kind: ${{ matrix.kind }}"
            exit 1
          fi
      - name: Upload Windows x86 package
        if: ${{ matrix.windows_x86 == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extension }}-i686-pc-windows-msvc
          path: artifacts/*.tar.gz
